name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read scenario
        run: |
          fail=$(jq -r '.fail' ci/scenario.json)
          echo "fail=$fail"
          sleep 10
          if [ "$fail" = "true" ]; then
            echo "ci/scenario.json requested a failure"
            exit 1
          fi
